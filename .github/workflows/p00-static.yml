# /.github/workflows/p00-static.yml
name: P00 static checks (not Unity acceptance)
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p00-static-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, verified ref
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Preserve the user's initial Unity files
        shell: bash
        run: |
          git diff --name-status --diff-filter=DMRT 53f11e80ec32ba1caa4f7009bdb600db6c14755a HEAD > /tmp/p00-initial-changes.txt
          cat /tmp/p00-initial-changes.txt
          test ! -s /tmp/p00-initial-changes.txt
      - name: Python tooling tests
        run: python3 -m unittest discover -s Tools/tests -v
      - name: Repository policy audit
        run: python3 Tools/p00.py audit
      - name: State the validation boundary
        run: echo 'Static checks only. Unity EditMode and Windows launch/exit are separate P00 gates.'
