# /.github/workflows/p00-static.yml
# 공용코드 수정: P01-B에서 사용자 검증 기준의 Unity 자산을 보호하고 P00/P01 도구를 함께 검사한다.
name: P00 static checks (not Unity acceptance)
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p00-static-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, existing pin retained
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Preserve the user's current Unity assets and settings
        shell: bash
        run: |
          # c130880 contains the user's URP 17.6.0, prepared layers, and P01-A.
          # New game source is allowed; existing user assets/settings are not rewritten.
          baseline=c1308802f5051c4475c463739749d56acdf7257c
          git cat-file -e "${baseline}^{commit}"
          git diff --name-status --diff-filter=DMRT "$baseline" HEAD -- \
            Packages ProjectSettings Assets .gitignore .gitattributes .vscode \
            ':(exclude)Assets/_Game' ':(exclude)Assets/_Game.meta' \
            > /tmp/p01-protected-changes.txt
          cat /tmp/p01-protected-changes.txt
          test ! -s /tmp/p01-protected-changes.txt
      - name: Python tooling tests
        run: python3 -m unittest discover -s Tools/tests -v
      - name: Repository policy audit
        run: python3 Tools/p00.py audit
      - name: P01 core source integrity
        run: python3 Tools/p01.py audit
      - name: State the validation boundary
        run: echo 'Static/tool checks only. Actual Unity and Windows acceptance remain separate gates.'
